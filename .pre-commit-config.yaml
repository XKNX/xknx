---
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        exclude_types: [csv, json]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: trailing-whitespace
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.8.1
    hooks:
      # Run `prek run --hook-stage manual python-typing-update --all-files` manually
      # from time to time to update python typing syntax.
      # Will require manual work, before submitting changes!
      - id: python-typing-update
        stages: [manual]
        args:
          - --py310-plus
          - --force
          - --keep-updates
        files: ^(xknx)/.+\.py$
  - repo: local
    hooks:
      # Every tool below runs from the locked project environment via `uv run`, so
      # its version is pinned in uv.lock only - no second pin to keep in sync here.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^((xknx|test|examples|docs)/.+)?[^/]+\.py$
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        require_serial: true
        files: ^xknx/.+\.py$

      - id: pylint-xknx
        name: pylint-xknx
        entry: uv run --frozen pylint xknx examples
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
        files: ^(xknx/|examples/)

      - id: pylint-test
        name: pylint-test
        entry: uv run --frozen pylint --disable=protected-access,abstract-class-instantiated
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
        files: ^test/
