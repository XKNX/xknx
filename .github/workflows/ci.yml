name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**" # run on all branches

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest

          - python-version: "3.13"
            os: macos-14

          - python-version: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --no-sync pytest --cov xknx --cov-report=
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true

  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run hooks
        run: uv run --no-sync prek run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  coverage:
    name: Process test coverage
    runs-on: ubuntu-latest
    needs: ["test"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
      - name: Create coverage report
        run: |
          uv run --no-sync coverage combine coverage-*/.coverage
          uv run --no-sync coverage report --fail-under=94
          uv run --no-sync coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
